<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 私密站点：禁止搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Baby Shower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #FBF8F2; }
      body { font-family: 'Nunito', sans-serif; color: #3D4A5C; -webkit-font-smoothing: antialiased; }
      a { color: #5B84AE; text-decoration: none; }
      a:hover { color: #47709A; }
      input, textarea, select, button { font-family: 'Nunito', sans-serif; }
      input[type=range] { accent-color: #5B84AE; }
      @keyframes bsFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes bsFadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes bsPopUp { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
